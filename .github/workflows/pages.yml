# Build the Vite app and publish it to GitHub Pages (constance-sun.github.io/little-tokyo/) on every push to main.
# One-time repo setting: Settings → Pages → Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # to see the legacy Pages build (see the deploy job)

# one deploy at a time; a newer push cancels a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # typecheck + vite build with base /little-tokyo/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Until the Pages source is switched to "GitHub Actions", GitHub also runs its legacy
      # "pages build and deployment" on each push, which publishes the raw source (a blank page).
      # The last deploy wins, so wait for that one to finish first. Harmless once the source is switched.
      - name: Wait for the legacy Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            n=$(gh run list -R "${{ github.repository }}" --commit "${{ github.sha }}" --json workflowName,status \
                  --jq '[.[] | select(.workflowName == "pages-build-deployment" and .status != "completed")] | length')
            [ "$n" = "0" ] && exit 0
            sleep 5
          done
      - id: deployment
        uses: actions/deploy-pages@v4
